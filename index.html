<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>STS Digital · demo's</title>
  <style>
    :root { --bg:#0d0c10; --ink:#ece7dd; --gold:#c6a86b; --mute:#8a8276; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font:300 18px/1.6 "Jost","Helvetica Neue",Arial,sans-serif; text-align:center; padding:24px; }
    h1 { font:300 clamp(2rem,6vw,3.2rem)/1.1 "Cormorant Garamond",Georgia,serif; margin:0 0 .4em; letter-spacing:.02em; }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.4em; font-size:.72rem; margin-bottom:1.2em; }
    p { color:var(--mute); max-width:46ch; margin:0 auto; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">STS Digital · Antwerpen</div>
    <h1>Demo-websites</h1>
    <p>Elke demo op dit adres is op maat gemaakt voor één zaak en alleen bereikbaar via de link die de zaak ontving.</p>
  </main>
</body>
</html>
